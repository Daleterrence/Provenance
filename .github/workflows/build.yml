name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'release'
    runs-on: windows-latest
    # any new warning fails the build, see Directory.Build.props
    env:
      ProvenanceCI: 'true'
    steps:
      - uses: actions/checkout@v4

      # the icon, logo and background live in their own private repo
      - uses: actions/checkout@v4
        with:
          repository: Daleterrence/Provenance-assets
          ssh-key: ${{ secrets.ASSETS_DEPLOY_KEY }}
          path: assets

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # has to be the same release as the Velopack package the app uses
      - name: Install vpk
        shell: pwsh
        run: |
          . ./tools/build-common.ps1
          dotnet tool install -g vpk --version (Get-VelopackVersion)

      - name: Pack
        id: pack
        shell: pwsh
        env:
          PROVENANCE_ASSETS: ${{ github.workspace }}\assets
        run: |
          . ./tools/build-common.ps1
          $committed = Get-ProvenanceVersion
          $version = $committed.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME doesn't match the version in Directory.Build.props ($version)."
          }
          $out = Join-Path $env:RUNNER_TEMP 'release'
          ./tools/pack-release.ps1 -Version $version -Out $out
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($committed.Suffix) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          "out=$out" >> $env:GITHUB_OUTPUT
          "setup=$((Get-ChildItem -LiteralPath $out -Filter '*-Setup.exe').FullName)" >> $env:GITHUB_OUTPUT

      # just the installer on a plain push, the whole folder would eat the artifact storage. A tag's files go on the draft
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: Provenance-${{ steps.pack.outputs.version }}
          path: ${{ steps.pack.outputs.setup }}
          if-no-files-found: error
          retention-days: 3

      # a tag makes a draft, nothing goes out until it's published by hand
      - name: Draft release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $a = @($env:GITHUB_REF_NAME) + @(Get-ChildItem '${{ steps.pack.outputs.out }}' -File | ForEach-Object FullName)
          $a += '--draft', '--title', 'Provenance ${{ steps.pack.outputs.version }}', '--notes', 'Provenance ${{ steps.pack.outputs.version }}'
          if ('${{ steps.pack.outputs.prerelease }}' -eq 'true') { $a += '--prerelease' }
          gh release create @a

  # publishing a release puts its files on the update server, updates.provenancexi.app
  upload:
    if: github.event_name == 'release'
    runs-on: windows-latest
    permissions:
      contents: read
    # vpk reads the channel's feed, adds the release and writes it back, so one upload per channel at a time. A run
    # that gets cancelled while it waits just needs a re-run, those are safe
    concurrency:
      group: update-server-${{ contains(github.event.release.tag_name, '-') && 'beta' || 'stable' }}
      cancel-in-progress: false
    steps:
      # only for Velopack's version, as of the tag being published
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install vpk
        shell: pwsh
        run: |
          . ./tools/build-common.ps1
          dotnet tool install -g vpk --version (Get-VelopackVersion)

      - name: Upload to R2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          foreach ($name in 'R2_ACCOUNT_ID', 'R2_ACCESS_KEY_ID', 'R2_SECRET_ACCESS_KEY') {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "The repository secret $name isn't set." }
          }
          if ($env:TAG -cnotmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "$env:TAG isn't a version tag like v1.0.0 or v1.0.0-beta.1." }
          # same rule as tools/pack-release.ps1, a suffix means beta
          $channel = if ($env:TAG.Contains('-')) { 'beta' } else { 'stable' }
          $dir = Join-Path $env:RUNNER_TEMP 'release'
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir $dir
          if ($LASTEXITCODE -ne 0) { throw "Couldn't download the files on release $env:TAG." }
          $package = "Provenance-$($env:TAG.Substring(1))-$channel-full.nupkg"
          if (-not (Test-Path -LiteralPath (Join-Path $dir $package))) { throw "Release $env:TAG has no $package, so it isn't the build for that tag." }
          # keeps the last 5 versions on each channel, older packages get deleted
          vpk --skip-updates upload s3 --outputDir $dir --channel $channel --bucket provenance-updates --region auto `
            --endpoint "https://$env:R2_ACCOUNT_ID.r2.cloudflarestorage.com" --keyId $env:R2_ACCESS_KEY_ID `
            --secret $env:R2_SECRET_ACCESS_KEY --keepMaxReleases 5
          if ($LASTEXITCODE -ne 0) { throw "vpk upload failed (exit code $LASTEXITCODE)" }
          "Provenance $($env:TAG.Substring(1)) is on the $channel channel." >> $env:GITHUB_STEP_SUMMARY
